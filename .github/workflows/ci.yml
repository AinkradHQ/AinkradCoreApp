# E12-6: App CI on GitHub's hosted Xcode 27 image (label `xcode-27`). No secrets and no signing here, so it runs on pull requests too.
# Local `make build` and `make test` stay the definition of done; this is the second opinion.
name: ci
on:
  pull_request:
  push:
    branches: [development, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: make build
      - run: make test
